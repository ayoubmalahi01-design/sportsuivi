<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SportSuivi</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1220">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--c:#121c30;--a:#22d3a6;--t:#e8eefc;--m:#8fa0c0;--r:#ff5d73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,Tahoma,sans-serif;padding-top:env(safe-area-inset-top)}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;background:linear-gradient(90deg,#0f2a4a,#0b1220);border-bottom:1px solid #1c2b47;position:sticky;top:0;z-index:5}
header b{color:var(--a);font-size:18px}header span{flex:1;color:var(--m);font-size:13px}
main{padding:14px 14px 100px;max-width:900px;margin:auto}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;overflow-x:auto;background:#0d1730;border-top:1px solid #1c2b47;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;min-width:70px;text-align:center;padding:8px 4px;font-size:11px;color:var(--m);cursor:pointer}
nav a i{display:block;font-style:normal;font-size:20px}nav a.on{color:var(--a)}
button{background:var(--a);color:#032;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font:inherit}
button.ghost{background:transparent;color:var(--m);border:1px solid #2a3a5c}
input,select,textarea{background:var(--c);color:var(--t);border:1px solid #243659;border-radius:10px;padding:10px;font:inherit;min-width:0}
.box{max-width:340px;margin:12vh auto;display:flex;flex-direction:column;gap:10px;padding:20px}.box h1{color:var(--a);text-align:center}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.f>*{flex:1 1 110px}
.r{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:12px;padding:10px 12px;margin:6px 0;animation:in .25s}
.r>span{flex:1}.r small{display:block;color:var(--m);font-size:12px}.r>b{min-width:28px;color:var(--a)}.r select{flex:0 0 auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.k{background:var(--c);border-radius:14px;padding:16px;text-align:center;color:var(--m)}.k b{display:block;font-size:30px;color:var(--a)}
.up{color:var(--a)}.dn{color:var(--r)}.n{color:var(--m)}.m{color:var(--m);text-align:center}
.chat{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.c{background:var(--c);padding:8px 12px;border-radius:12px;max-width:80%;align-self:flex-start}.c.me{align-self:flex-end;background:#0f3b3a}.c small{display:block;color:var(--m);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #243659;text-align:start}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
const sb=supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const RK={super_admin:4,sub_admin:3,admin:2,coach:1},RL={super_admin:'سوبر أدمن',sub_admin:'أدمن فرعي',admin:'إدارة',coach:'مدرب'};
const ST={present:'حاضر',absent:'غائب',late:'متأخر',permission:'إذن',exempt:'معفى',official_duty:'مهمة رسمية'};
const I18N={
 ar:{weight:'الوزن',height:'الطول',bmi:'مؤشر كتلة الجسم',date:'تاريخ القياس',history:'سجل الوزن',severe:'نحافة شديدة',thin:'نحافة',normal:'وزن طبيعي',over:'زيادة في الوزن',obese:'سمنة',na:'تصنيف غير متاح',unavailable:'التصنيف غير متاح',invalid:'قيم غير صالحة',saved:'تم الحفظ',lang:'اللغة'},
 fr:{weight:'Poids',height:'Taille',bmi:'Indice de masse corporelle',date:'Date de mesure',history:'Historique du poids',severe:'Maigreur sévère',thin:'Maigreur',normal:'Corpulence normale',over:'Surpoids',obese:'Obésité',na:'Classification indisponible',unavailable:'Classification indisponible',invalid:'Valeurs invalides',saved:'Enregistré',lang:'Langue'},
 en:{weight:'Weight',height:'Height',bmi:'Body Mass Index',date:'Measurement date',history:'Weight history',severe:'Severe thinness',thin:'Thinness',normal:'Normal weight',over:'Overweight',obese:'Obesity',na:'Classification unavailable',unavailable:'Classification unavailable',invalid:'Invalid values',saved:'Saved',lang:'Language'}
};
let lang=localStorage.getItem('lang')||'ar';
function t(k){return (I18N[lang]&&I18N[lang][k])||I18N.ar[k]||k;}
function setLang(l){lang=l;localStorage.setItem('lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';go(tab);}
let me,tab='home',timer,studs=[];
const adm=()=>RK[me.role]>=2,today=()=>new Date().toISOString().slice(0,10);
const opts=(a,v,l)=>a.map(x=>`<option value="${esc(x[v])}">${esc(typeof l=='function'?l(x):x[l])}</option>`).join('');
const err=e=>{if(e){alert(e.message);return true}};
const dl=(d,hi)=>!d?'':`<small class="${hi===null?'n':(d>0)==hi?'up':'dn'}">${d>0?'↑':'↓'} ${Math.abs(+d.toFixed(2))}</small>`;
const sopt=()=>opts(studs,'id',s=>s.student_number+' - '+s.full_name);
const out=async()=>{await sb.auth.signOut();login()};

function bmi(w,h){w=+w;h=+h;if(!w||!h||w<=0||h<=0)return null;return w/Math.pow(h/100,2);}
function ageOn(birth,dateStr){if(!birth)return null;const b=new Date(birth),d=new Date(dateStr);let a=d.getFullYear()-b.getFullYear();const m=d.getMonth()-b.getMonth();if(m<0||(m===0&&d.getDate()<b.getDate()))a--;return a<0?null:a;}
function bmiClass(b,age,gender){
 if(b==null)return t('na');
 if(age==null||age<18||!gender)return t('unavailable');
 if(b<16)return t('severe');
 if(b<18.5)return t('thin');
 if(b<25)return t('normal');
 if(b<30)return t('over');
 return t('obese');
}
function bmiText(m,s){
 const b=bmi(m.weight_kg,m.height_cm);
 const age=ageOn(s.birth_date,m.measured_on);
 const cat=bmiClass(b,age,s.gender);
 return (b==null?'-':b.toFixed(2))+' — '+cat;
}

function login(){
 app.innerHTML=`<div class=box><h1>SportSuivi</h1><input id=n placeholder="الاسم (عند التسجيل)">`+
 `<input id=e type=email placeholder="البريد الإلكتروني"><input id=p type=password placeholder="كلمة المرور">`+
 `<button id=li>دخول</button><button id=su class=ghost>تسجيل جديد</button></div>`;
 $('#li').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});err(error)||boot()};
 $('#su').onclick=async()=>{const{error}=await sb.auth.signUp({email:$('#e').value.trim(),password:$('#p').value,options:{data:{full_name:$('#n').value.trim()}}});err(error)||(alert('تم. التسجيل قيد المراجعة.'),boot())};
}
function wait(){app.innerHTML=`<div class=box><h1>SportSuivi</h1><p class=m>${me.status==='pending'?'الحساب قيد المراجعة.':'الحساب موقوف.'}</p><button onclick=boot()>تحديث</button><button class=ghost onclick=out()>خروج</button></div>`}
async function boot(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session)return login();
 const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 me=data;if(!me)return login();
 if(me.status!=='active')return wait();
 studs=(await sb.from('students').select('id,student_number,full_name,gender,birth_date').eq('archived',false).order('student_number')).data||[];
 shell();
}
const TABS=[['home','🏠','الرئيسية'],['students','👥','الطلاب'],['att','📅','الحضور'],['results','📊','النتائج'],['weight','⚖️','الوزن'],['notes','📝','الملاحظات'],['chat','💬','المحادثة',()=>me.role==='coach'],['team','🛡️','الفريق',adm],['tests','🧪','الاختبارات',adm]];
function shell(){
 app.innerHTML=`<header><b>SportSuivi</b><span>${esc(me.full_name||'')} — ${RL[me.role]}</span>`+
 `<select id=lang onchange="setLang(this.value)" style="width:auto">${['ar','fr','en'].map(l=>`<option value="${l}" ${lang===l?'selected':''}>${l.toUpperCase()}</option>`).join('')}</select>`+
 `<button class=ghost onclick=out()>خروج</button></header><main id=v></main><nav>${TABS.filter(t=>!t[3]||t[3]()).map(t=>`<a data-t=${t[0]}><i>${t[1]}</i>${t[2]}</a>`).join('')}</nav>`;
 document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>go(a.dataset.t));
 go(tab);
}
async function go(t){
 tab=t;clearInterval(timer);
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t==t));
 $('#v').innerHTML='<p class=m>...</p>';await V[t]();
}
const V={
home:async()=>{
 const c=async(t,f)=>{let q=sb.from(t).select('id',{count:'exact',head:true});if(f)q=f(q);return(await q).count||0};
 const[s,r]=await Promise.all([c('students',q=>q.eq('archived',false)),c('test_results')]);
 const p=adm()?await c('profiles',q=>q.eq('status','pending')):0;
 $('#v').innerHTML=`<div class=g><div class=k><b>${s}</b> طالب</div><div class=k><b>${r}</b> نتيجة</div>${adm()?`<div class=k><b>${p}</b> بانتظار الموافقة</div>`:''}</div>`;
},
students:async()=>{
 const{data:ms}=await sb.from('body_measurements').select('student_id,weight_kg,height_cm,measured_on').order('measured_on',{ascending:false});
 const latest={};for(const m of (ms||[]))if(!latest[m.student_id])latest[m.student_id]=m;
 const draw=f=>$('#l').innerHTML=studs.filter(s=>!f||(s.full_name+s.student_number).includes(f)).map(s=>{
  const m=latest[s.id];const info=m?`<small>${t('bmi')}: ${bmiText(m,s)}</small>`:'';
  return `<div class=r><b>${s.student_number}</b><span>${esc(s.full_name)}${info}</span></div>`}).join('')||'<p class=m>لا يوجد</p>';
 $('#v').innerHTML=`${adm()?`<div class=f><input id=no type=number placeholder="رقم"><input id=nm placeholder="الاسم"><select id=gn><option value="">جنس</option><option value=M>ذكر</option><option value=F>أنثى</option></select><input id=bd type=date placeholder="تاريخ الميلاد"><button id=ad>إضافة</button></div>`:''}<div class=f><input id=s placeholder="بحث"></div><div id=l></div>`;
 draw();$('#s').oninput=e=>draw(e.target.value);
 if(adm())$('#ad').onclick=async()=>{if(!err((await sb.from('students').insert({student_number:+$('#no').value,full_name:$('#nm').value.trim(),gender:$('#gn').value||null,birth_date:$('#bd').value||null})).error))boot()};
},
att:async()=>{
 $('#v').innerHTML=`<div class=f><input id=d type=date value="${today()}"><button id=sv>حفظ</button></div><div id=l></div>`;
 const load=async()=>{const{data}=await sb.from('attendance').select('student_id,status').eq('attendance_date',$('#d').value);const m=Object.fromEntries((data||[]).map(x=>[x.student_id,x.status]));$('#l').innerHTML=studs.map(s=>`<div class=r><b>${s.student_number}</b><span>${esc(s.full_name)}</span><select data-i=${s.id}>${Object.entries(ST).map(([k,v])=>`<option value=${k}${(m[s.id]||'present')==k?' selected':''}>${v}</option>`).join('')}</select></div>`).join('')};
 await load();$('#d').onchange=load;
 $('#sv').onclick=async()=>{const rows=[...document.querySelectorAll('#l select')].map(x=>({student_id:x.dataset.i,attendance_date:$('#d').value,status:x.value}));const{error}=await sb.from('attendance').upsert(rows,{onConflict:'student_id,attendance_date'});alert(error?error.message:'تم الحفظ')};
},
results:async()=>{
 const[{data:rs},{data:ts}]=await Promise.all([sb.from('test_results').select('*,students(full_name),test_definitions(name,unit,higher_is_better)').order('tested_on',{ascending:false}).limit(300),sb.from('test_definitions').select('*').order('name')]);
 const rows=(rs||[]).map((x,i)=>{const nx=rs.slice(i+1).find(y=>y.student_id==x.student_id&&y.test_id==x.test_id),d=x.test_definitions;return `<div class=r><span>${esc(x.students.full_name)}<small>${esc(d.name)} — ${x.tested_on}</small></span><b>${x.raw_value} ${esc(d.unit||'')}</b>${nx?dl(x.raw_value-nx.raw_value,d.higher_is_better):''}</div>`}).join('');
 $('#v').innerHTML=`${adm()?`<div class=f><select id=st>${sopt()}</select><select id=ts>${opts(ts||[],'id','name')}</select><input id=vl type=number step=any placeholder="القيمة"><input id=dt type=date value="${today()}"><button id=ad>إضافة</button></div>`:''}${rows||'<p class=m>لا توجد نتائج</p>'}`;
 if(adm())$('#ad').onclick=async()=>{if(!err((await sb.from('test_results').insert({student_id:$('#st').value,test_id:$('#ts').value,raw_value:+$('#vl').value,tested_on:$('#dt').value})).error))go('results')};
},
weight:async()=>{
 const{data:ms}=await sb.from('body_measurements').select('*,students(full_name,gender,birth_date)').order('measured_on',{ascending:false}).limit(500);
 const rows=(ms||[]).map(m=>`<div class=r><span>${esc(m.students.full_name)}<small>${m.measured_on}${m.height_cm?' — '+m.height_cm+' سم':''}</small></span><b>${m.weight_kg??'-'} كغ</b><small>${bmiText(m,m.students)}</small></div>`).join('');
 $('#v').innerHTML=`${adm()?`<div class=f><select id=st>${sopt()}</select><input id=w type=number step=any placeholder="${t('weight')} (كغ)"><input id=h type=number step=any placeholder="${t('height')} (سم)"><input id=dt type=date value="${today()}"><button id=ad>${t('saved')==='Saved'?'Save':'+ '+t('weight')}</button></div>`:''}<div class=f><select id=hf><option value="">${t('history')}: ${t('weight')}</option>${studs.map(s=>`<option value="${s.id}">${esc(s.student_number+' - '+s.full_name)}</option>`).join('')}</select></div><div id=hist></div>${rows||'<p class=m>لا توجد قياسات</p>'}`;
 if(adm())$('#ad').onclick=async()=>{
  const w=$('#w').value,h=$('#h').value;
  if(!w||!h||+w<=0||+h<=0){alert(t('invalid'));return;}
  if(!err((await sb.from('body_measurements').insert({student_id:$('#st').value,weight_kg:+w,height_cm:+h,measured_on:$('#dt').value})).error)){alert(t('saved'));go('weight')}
 };
 $('#hf').onchange=async()=>{
  const sid=$('#hf').value;if(!sid){$('#hist').innerHTML='';return;}
  const{data}=await sb.from('body_measurements').select('*,students(full_name,gender,birth_date)').eq('student_id',sid).order('measured_on',{ascending:false});
  $('#hist').innerHTML=`<h4>${t('history')}</h4><table><tr><th>${t('date')}</th><th>${t('weight')}</th><th>${t('height')}</th><th>${t('bmi')}</th><th>التصنيف</th></tr>`+
  (data||[]).map(m=>`<tr><td>${m.measured_on}</td><td>${m.weight_kg??'-'}</td><td>${m.height_cm??'-'}</td><td>${bmi(m.weight_kg,m.height_cm)==null?'-':bmi(m.weight_kg,m.height_cm).toFixed(2)}</td><td>${bmiClass(bmi(m.weight_kg,m.height_cm),ageOn(m.students.birth_date,m.measured_on),m.students.gender)}</td></tr>`).join('')+`</table>`;
 };
},
notes:async()=>{
 const{data}=await sb.from('observations').select('*,students(full_name),profiles(full_name)').order('created_at',{ascending:false}).limit(100);
 $('#v').innerHTML=`<div class=f><select id=st>${sopt()}</select><textarea id=b placeholder="ملاحظة..."></textarea><button id=ad>حفظ</button></div>`+(data||[]).map(x=>`<div class=r><span>${esc(x.students.full_name)}<small>${esc(x.profiles?.full_name||'')} — ${x.created_at.slice(0,10)}</small>${esc(x.body)}</span></div>`).join('');
 $('#ad').onclick=async()=>{const b=$('#b').value.trim();if(b&&!err((await sb.from('observations').insert({student_id:$('#st').value,body:b})).error))go('notes')};
},
chat:async()=>{
 $('#v').innerHTML=`<div id=l class=chat></div><div class=f><input id=m placeholder="رسالة..."><button id=sd>إرسال</button></div>`;
 const ld=async()=>{const{data}=await sb.from('chat_messages').select('body,author_id,profiles(full_name)').order('created_at',{ascending:false}).limit(100);const l=$('#l');if(!l)return;l.innerHTML=(data||[]).reverse().map(x=>`<div class="c${x.author_id==me.id?' me':''}"><small>${esc(x.profiles?.full_name||'')}</small>${esc(x.body)}</div>`).join('');l.scrollTop=1e9};
 await ld();timer=setInterval(ld,10000);
 $('#sd').onclick=async()=>{const b=$('#m').value.trim();if(b&&!err((await sb.from('chat_messages').insert({body:b})).error)){$('#m').value='';ld()}};
},
team:async()=>{
 const{data}=await sb.from('profiles').select('*').order('created_at');
 $('#v').innerHTML=(data||[]).map(p=>{
  const lo=RK[me.role]>RK[p.role]&&p.id!=me.id,b=(l,x)=>`<button data-i=${p.id} data-p='${JSON.stringify(x)}'>${l}</button>`;
  return `<div class=r><span>${esc(p.full_name||'-')}<small>${RL[p.role]} — ${p.status}</small></span>${lo?(p.status!=='active'?b('تفعيل',{status:'active'}):b('تعليق',{status:'suspended'}))+(p.role==='coach'&&RK[me.role]>=3?b('ترقية لإدارة',{role:'admin'}):''):''}</div>`}).join('');
 document.querySelectorAll('#v [data-p]').forEach(x=>x.onclick=async()=>{if(!err((await sb.from('profiles').update(JSON.parse(x.dataset.p)).eq('id',x.dataset.i)).error))go('team')});
},
tests:async()=>{
 const{data}=await sb.from('test_definitions').select('*').order('name');
 $('#v').innerHTML=`<div class=f><input id=nm placeholder="اسم الاختبار"><input id=un placeholder="الوحدة"><label><input id=hi type=checkbox checked> الأعلى أفضل</label><button id=ad>إضافة</button></div>`+(data||[]).map(t=>`<div class=r><span>${esc(t.name)}</span><small>${esc(t.unit||'')}</small></div>`).join('');
 $('#ad').onclick=async()=>{if(!err((await sb.from('test_definitions').insert({name:$('#nm').value.trim(),unit:$('#un').value.trim(),higher_is_better:$('#hi').checked})).error))go('tests')};
}};
boot();
</script></body></html>
